[versions]
kotlin = "1.9.25"
composeCompiler = "1.5.14"
kotlinxSerializationJson = "1.8.1"
gson = "2.13.0"
ktorClientCore = "3.9.1"
ktorClientOkhttp = "3.9.1"
ktorClientContentNegotiation = "3.9.1"
ktorSerializationKotlinxJson = "3.9.1"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jetbrains-kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJsonVersion" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClientCore" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClientCore" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorClientContentNegotiation" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorSerializationKotlinxJson" }

# Compose as regular libraries (NOT Compose Desktop plugin)
compose-bom = { group = "org.jetbrains.compose", name = "compose-bom", version.ref = "composeCompiler" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeCompiler" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeCompiler" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeCompiler" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeCompiler" }
compose-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "composeCompiler" }
compose-window = { group = "org.jetbrains.compose.window", name = "window", version.ref = "composeCompiler" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }