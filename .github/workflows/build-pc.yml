name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: List Gradle Tasks
        run: .\gradlew.bat tasks --all --no-daemon

      - name: Build Compose Desktop Package (MSI)
        run: .\gradlew.bat packageMsi --no-daemon

      - name: Find Portable App Directory
        id: artifacts
        run: |
          $dir = (Get-ChildItem desktop/build/compose/binaries/main/app -Directory | Select-Object -First 1).FullName
          echo "artifact_dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Zip Portable App
        run: |
          Compress-Archive -Path "${{ steps.artifacts.outputs.artifact_dir }}\*" -DestinationPath "AI-Hub-PC-Portable.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: AI-Hub-PC-Portable.zip
          generate_release_notes: true