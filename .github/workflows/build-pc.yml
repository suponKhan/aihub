name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build Fat JAR
        run: .\gradlew.bat jar --no-daemon

      - name: Find JAR
        id: jar
        run: |
          $jar = Get-ChildItem desktop/build/libs/*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          echo "jar_name=$($jar.Name)" >> $env:GITHUB_OUTPUT

      - name: Create Portable App with jpackage
        run: |
          jpackage --type app-image             --input desktop/build/libs             --main-jar ${{ steps.jar.outputs.jar_name }}             --main-class com.foss.aihub.pc.MainKt             --name "AI Hub PC"             --app-version ${{ github.event.inputs.version || '1.0.0' }}             --dest portable-output             --java-options "-Xmx1g"

      - name: Zip Portable App
        run: |
          Compress-Archive -Path "portable-output\AI Hub PC\*" -DestinationPath "AI-Hub-PC-Portable.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: AI-Hub-PC-Portable.zip
          generate_release_notes: true