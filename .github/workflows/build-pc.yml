name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies for headless Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrender-dev libxtst-dev libxi-dev xvfb

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      - name: Build Compose Desktop Package
        run: |
          xvfb-run -a ./gradlew package --no-daemon

      - name: Find Portable App Directory
        id: artifacts
        run: |
          dir=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -type d | head -2 | tail -1)
          echo "artifact_dir=$dir" >> $GITHUB_OUTPUT

      - name: Zip Portable App
        run: |
          cd "${{ steps.artifacts.outputs.artifact_dir }}"
          zip -r "${{ github.workspace }}/AI-Hub-PC-Portable.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: AI-Hub-PC-Portable.zip
          generate_release_notes: true