name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      
      - name: Build Fat JAR with info
        run: .\gradlew.bat jar --info --no-daemon
      
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: desktop/build/
          retention-days: 1
      
      - name: Find JAR
        id: artifacts
        run: |
          $jar = Get-ChildItem desktop/build/libs/aihub-pc-*.jar | Select-Object -First 1
          echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: ${{ steps.artifacts.outputs.jar_path }}
          generate_release_notes: true