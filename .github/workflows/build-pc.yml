name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build JAR
        run: ./gradlew :desktop:jar --no-daemon
      
      - name: Find Artifacts
        id: artifacts
        run: |
          echo "artifact_dir=$(find desktop/build/libs -name '*.jar' | head -1 | xargs dirname)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: ${{ steps.artifacts.outputs.artifact_dir }}/*
          generate_release_notes: true