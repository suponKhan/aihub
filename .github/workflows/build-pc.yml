name: Build PC Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      
      - name: List project structure
        run: |
          dir
          echo "---"
          dir desktop
      
      - name: Build Fat JAR with verbose output
        run: .\gradlew.bat jar --info --stacktrace --no-daemon
      
      - name: Check build output
        run: |
          echo "=== Build directory ==="
          if (Test-Path desktop/build) { dir desktop/build } else { echo "desktop/build NOT FOUND" }
          echo "=== Libs directory ==="
          if (Test-Path desktop/build/libs) { dir desktop/build/libs } else { echo "desktop/build/libs NOT FOUND" }
          echo "=== All JARs ==="
          Get-ChildItem -Recurse -Filter *.jar | ForEach-Object { $_.FullName }
      
      - name: Find JAR
        id: artifacts
        run: |
          $jar = Get-ChildItem desktop/build/libs/aihub-pc-*.jar -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($jar) {
            echo "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
            echo "FOUND JAR: $($jar.FullName)"
          } else {
            echo "NO JAR FOUND"
          }
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: AI Hub PC v${{ github.event.inputs.version || '1.0.0' }}
          files: ${{ steps.artifacts.outputs.jar_path }}
          generate_release_notes: true